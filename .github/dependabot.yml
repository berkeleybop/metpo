version: 2
updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days before adopting a new release (supply-chain cooldown, mirrors
    # the pinact --min-age 7 used when SHA-pinning the actions).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # codeql.yml uses github/codeql-action at two subpaths, init and analyze.
    # CodeQL requires every step in a run to be on the same version, so an
    # ungrouped bump splits into two PRs that each fail with "Loaded a
    # configuration file for version X, but running version Y" until both
    # land. Grouping keeps the pair in one PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

  # Python dependencies (uv / pyproject.toml + uv.lock).
  # Replaces the home-grown uv-upgrade.yml bot, whose PRs could never trigger
  # the required CI checks (GITHUB_TOKEN-opened PRs do not fire workflows), so
  # branch protection blocked them forever (#416). Dependabot-opened PRs do run
  # CI. The `python-deps` group batches all Python updates into a single weekly
  # PR (mirroring the old bot's bulk `uv lock --upgrade`, with less PR noise
  # than per-dependency PRs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
